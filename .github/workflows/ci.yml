# CI: corre en cada PR y en cada push a main.
#   app        -> lint, typecheck, tests, build de las Lambdas
#   terraform  -> fmt + validate (sin tocar AWS)
#   plan       -> solo en PR y solo si la variable AWS_ROLE_ARN existe: terraform plan comentado en el PR
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # necesario para OIDC con AWS
  pull-requests: write # para comentar el plan

jobs:
  app:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # lee la versión de "packageManager" en package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Audit dependencies (informativo)
        run: pnpm audit --audit-level high || echo "::warning::pnpm audit encontró vulnerabilidades; revisa el log"

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - run: terraform fmt -check -recursive terraform
      - name: Validate bootstrap
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
      - name: Validate envs/dev
        run: |
          terraform -chdir=terraform/envs/dev init -backend=false -input=false
          terraform -chdir=terraform/envs/dev validate

  plan:
    name: Terraform plan (PR)
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
    needs: [app, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # archive_file necesita las carpetas dist/
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: |
          terraform -chdir=terraform/envs/dev init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: Plan
        id: plan
        run: |
          terraform -chdir=terraform/envs/dev plan -no-color -input=false \
            -var "notification_email=${{ vars.NOTIFICATION_EMAIL }}" \
            -var "enable_opensearch=${{ vars.ENABLE_OPENSEARCH || 'false' }}" \
            | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (envs/dev)\n```\n' + plan + '\n```',
            });
